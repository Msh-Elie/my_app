services:
  - type: web
    name: switchmoney-backend
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      # OBLIGATOIRE en production. Sans cette variable, le backend retombe sur
      # SQLite — or le disque d'une instance gratuite est éphémère : elle
      # s'arrête après 15 min d'inactivité et redémarre à vide, ce qui efface
      # tous les comptes créés. Coller ici la chaîne de connexion d'une base
      # PostgreSQL gérée (Neon, Supabase…), au format :
      #   postgresql://utilisateur:motdepasse@hote/base?sslmode=require
      - key: DATABASE_URL
        sync: false
      - key: PAWA_TOKEN
        sync: false
      - key: PAWA_BASE
        value: https://api.sandbox.pawapay.io/v2
      - key: CALLBACK_SECRET
        sync: false
      - key: AUTH_SECRET
        sync: false
      - key: FEE_RECIPIENT
        sync: false
      - key: ENABLE_SIMULATE
        value: "false"
      - key: VERIFY_CALLBACK_SIGNATURE
        value: "false"
      # FedaPay — rail secondaire, seul à couvrir Celtis Bénin (absent de
      # PawaPay). Sans FEDAPAY_SECRET_KEY, Celtis est annoncé comme
      # indisponible à l'envoi comme à la réception.
      - key: FEDAPAY_SECRET_KEY
        sync: false
      - key: FEDAPAY_BASE
        value: https://sandbox-api.fedapay.com/v1
      # Droits à faire ouvrir par le support FedaPay sur le compte, puis à
      # passer à "true" ici. Vérifié le 25/09/2026 : les deux sont fermés
      # (charge directe -> HTTP 400, payout -> HTTP 403).
      - key: FEDAPAY_PAYOUTS_ENABLED
        value: "false"
      - key: FEDAPAY_DIRECT_CHARGE_ENABLED
        value: "false"
      # PORT n'est pas défini ici : Render l'injecte automatiquement et
      # server.js le lit déjà via process.env.PORT.
